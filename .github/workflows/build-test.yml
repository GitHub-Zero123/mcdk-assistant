name: Build Test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to build"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            build_type: Release
            artifact: mcdk-assistant-windows-x64
            archive_ext: zip
          - name: Ubuntu GCC
            os: ubuntu-latest
            build_type: Release
            artifact: mcdk-assistant-linux-x64
            archive_ext: tar.gz
          - name: macOS Clang
            os: macos-latest
            build_type: Release
            artifact: mcdk-assistant-macos-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: false

      - name: Checkout public submodules
        run: git submodule update --init --recursive libs/cppjieba/deps/limonp

      - name: Checkout optional solutions submodule
        shell: bash
        run: |
          git submodule update --init --recursive solutions || true

      - name: Setup MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw "Visual Studio installation with C++ tools was not found."
          }

          $vcvars = Join-Path $installPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat was not found: $vcvars"
          }

          $envDump = cmd /c "`"$vcvars`" && set"
          foreach ($line in $envDump) {
            if ($line -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              $value = $matches[2]

              if ($name -eq "Path") {
                $value -split ";" | Where-Object { $_ } | Add-Content -Path $env:GITHUB_PATH
              } elseif ($name -match "^(INCLUDE|LIB|LIBPATH|VSCMD_ARG_TGT_ARCH|VSCMD_VER|VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UCRTVersion|UniversalCRTSdkDir)$") {
                "$name=$value" | Add-Content -Path $env:GITHUB_ENV
              }
            }
          }

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build/ci
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/package
          -DMCDK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/ci --config ${{ matrix.build_type }} --target all --parallel

      - name: Install
        run: cmake --install build/ci --config ${{ matrix.build_type }}

      - name: Verify installed package
        shell: bash
        run: |
          test -d package/dicts
          test ! -d package/knowledge
          test -f package/mcdk_index_cache.bin
          test -f package/mcdk_sapi_index_cache.bin

          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f package/mcdk-assistant.exe
            test -f package/mcdk-asst-lite.exe
            test -f package/mcdk-asst-server.exe
          else
            test -f package/mcdk-assistant
            test -f package/mcdk-asst-lite
            test -f package/mcdk-asst-server
          fi

          if [ -f solutions/cpp/solution_index.cpp ]; then
            test -f package/mcdk_solutions_cache.bin
          else
            test ! -f package/mcdk_solutions_cache.bin
          fi

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C package .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path package\* -DestinationPath "dist\${{ matrix.artifact }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.${{ matrix.archive_ext }}
